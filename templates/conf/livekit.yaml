port: 7880
rtc:
  tcp_port: 7881
  udp_port: 7882
  ${rtc_ip_config}
room:
  auto_create: false # lk-jwt-service creates rooms for authorised users
turn:
  enabled: true
  domain: ${rtc_host}
  udp_port: 3478
  tls_port: 5349
  cert_file: /certs/${rtc_host}.crt
  key_file: /certs/${rtc_host}.key
webhook:
  api_key: "${livekit_key}"
  urls:
    - https://${matrix_host}/livekit/jwt/sfu_webhook
keys:
  "${livekit_key}": "${livekit_secret}"
